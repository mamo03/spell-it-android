<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spell It!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#54C6EB; --sky-deep:#2FB1D9; --sun:#FFD166; --coral:#FF6F5E;
    --leaf:#06D6A0; --ink:#20344A; --cloud:#FFFFFF; --violet:#8B7CF6;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* This is a single, deliberately bright, high-contrast palette for young kids —
     not a dual light/dark theme. Text colors are paired with fixed card/slot
     backgrounds throughout, so the palette intentionally does not follow the
     device's system dark-mode setting (which previously made filled letter
     slots render near-white text on a near-white background on some phones). */
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100%; font-family:'Nunito', sans-serif;
    background:linear-gradient(180deg,var(--sky) 0%, var(--sky-deep) 100%);
    color:var(--ink); display:flex; flex-direction:column; align-items:center; overflow-x:hidden;
  }
  .wrap{ width:100%; max-width:480px; padding:16px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  h1{ font-family:'Baloo 2', sans-serif; color:#fff; font-size:28px; margin:2px 0 0; text-shadow:0 3px 0 rgba(0,0,0,0.12); }
  .tagline{ color:#fff; opacity:0.9; font-weight:600; margin-top:-10px; text-align:center; font-size:14px; }
  .hidden{ display:none !important; }

  /* Games screen */
  .game-list{ width:100%; display:flex; flex-direction:column; gap:16px; margin-top:6px; }
  .game-card{
    background:var(--cloud); border:none; border-radius:26px; padding:22px 20px;
    display:flex; align-items:center; gap:18px; cursor:pointer; text-align:left;
    box-shadow:0 8px 0 rgba(0,40,60,0.18); width:100%;
  }
  .game-card:active{ transform:translateY(4px); box-shadow:0 4px 0 rgba(0,40,60,0.18); }
  .game-emoji{ font-size:44px; width:60px; text-align:center; }
  .game-info{ flex:1; }
  .game-name{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:21px; color:var(--ink); }
  .game-tagline{ font-size:13px; color:#6B7C8C; font-weight:600; margin-top:3px; }

  /* Levels screen */
  .screen-back{
    align-self:flex-start; border:none; background:rgba(255,255,255,0.25); color:#fff; font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:14px; padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .level-list{ width:100%; display:flex; flex-direction:column; gap:14px; margin-top:2px; }
  .level-card{
    background:var(--cloud); border:none; border-radius:22px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer; text-align:left;
    box-shadow:0 8px 0 rgba(0,40,60,0.18); width:100%;
  }
  .level-card:active{ transform:translateY(4px); box-shadow:0 4px 0 rgba(0,40,60,0.18); }
  .level-emoji{ font-size:38px; width:56px; text-align:center; }
  .level-info{ flex:1; }
  .level-name{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:19px; color:var(--ink); }
  .level-sub{ font-size:13px; color:#6B7C8C; font-weight:600; margin-top:2px; }
  .level-easy .level-emoji{ color:var(--leaf); }

  /* Game screen */
  .top-bar{ width:100%; display:flex; align-items:center; }
  .back-btn{
    border:none; background:rgba(255,255,255,0.25); color:#fff; font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:14px; padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .progress{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .dot{ width:13px;height:13px;border-radius:50%; background:rgba(255,255,255,0.35); border:2px solid rgba(255,255,255,0.6); transition:transform .25s ease, background .25s ease; }
  .dot.done{ background:var(--sun); border-color:var(--sun); transform:scale(1.15); }
  .dot.current{ transform:scale(1.3); border-color:#fff; }

  .stage{ width:100%; background:var(--cloud); border-radius:28px; padding:18px 18px 16px; box-shadow:0 14px 0 rgba(0,40,60,0.18); display:flex; flex-direction:column; align-items:center; gap:12px; }
  .picture-frame{ width:112px;height:112px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #FFF6DA, var(--sun)); display:flex;align-items:center;justify-content:center; font-size:56px; box-shadow:inset 0 -6px 0 rgba(0,0,0,0.08); user-select:none; }
  .picture-frame.bump{ animation:bump .5s ease; }
  @keyframes bump{ 0%{transform:scale(1)} 30%{transform:scale(1.12)} 100%{transform:scale(1)} }

  .say-btn{ border:none; background:var(--sky-deep); color:#fff; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px; padding:8px 16px; border-radius:999px; display:flex; align-items:center; gap:8px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.15); }
  .say-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }

  /* Spell It! mode */
  .slots{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; min-height:38px; }
  .slot{ width:32px;height:38px; border-radius:8px; border:3px solid #D9E4EC; display:flex;align-items:center;justify-content:center; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:18px; color:var(--ink); background:#F5F9FB; }
  .slot.filled{ border-color:var(--leaf); background:#E7FBF4; }

  .tiles{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-top:2px; }
  .tile{ width:40px;height:44px; border-radius:12px; border:none; background:var(--coral); color:#fff; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:19px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.18); }
  .tile:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.18); }
  .tile.used{ visibility:hidden; }
  .tile.shake{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* Pick It! mode (also used by Add It!'s answer choices) — a 2-column grid instead
     of one option per line, so 5 choices take up about half the vertical space. */
  .pick-options{ display:grid; grid-template-columns:repeat(2, 1fr); gap:9px 10px; width:100%; max-width:360px; }
  .pick-option{
    border:none; border-radius:14px; padding:11px 8px; width:100%;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:15px; line-height:1.15;
    cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.18); text-align:center;
    word-break:break-word; overflow-wrap:break-word;
  }
  /* With an odd number of choices (5), let the last one span both columns so it's
     centered on its own row instead of leaving an awkward empty cell. */
  .pick-options .pick-option:last-child:nth-child(odd){ grid-column:1 / -1; max-width:calc(50% - 5px); justify-self:center; }
  .pick-option:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.18); }
  .pick-option.shake{ animation:shake .4s ease; }
  .pick-option.pc0{ background:var(--coral); color:#fff; }
  .pick-option.pc1{ background:var(--sky-deep); color:#fff; }
  .pick-option.pc2{ background:var(--violet); color:#fff; }
  .pick-option.pc3{ background:var(--sun); color:var(--ink); }
  .pick-option.correct{ background:var(--leaf); color:#fff; }
  .pick-option.dim{ opacity:0.4; }
  .pick-option.locked{ pointer-events:none; }

  /* Add It! mode */
  .sentence-card{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:18px; color:var(--ink); text-align:center; line-height:1.45; padding:2px 4px; }
  .blank-chip{ display:inline-block; min-width:70px; padding:2px 12px; border-bottom:3px dashed var(--coral); font-weight:800; color:var(--coral); }
  .blank-chip.filled{ border-bottom-color:transparent; color:var(--leaf); }

  .celebrate{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:19px; color:var(--leaf); min-height:22px; text-align:center; }
  .next-btn, .home-btn, .redo-btn{ border:none; color:#fff; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px; padding:10px 18px; border-radius:999px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.15); display:none; }
  .next-btn{ background:var(--leaf); }
  .redo-btn{ background:var(--sun); color:var(--ink); }
  .home-btn{ background:var(--violet); }
  .next-btn.show, .home-btn.show, .redo-btn.show{ display:inline-block; }
  .next-btn:active, .home-btn:active, .redo-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }

  .confetti{ position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:5; }
  .confetti span{ position:absolute; top:-20px; font-size:20px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); opacity:0.9; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- GAMES SCREEN -->
  <div id="gamesScreen">
    <h1>Let's Play! 🎈</h1>
    <div class="tagline">Choose a game to start</div>
    <div class="game-list" id="gameList"></div>
  </div>

  <!-- LEVELS SCREEN -->
  <div id="levelScreen" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:16px;">
    <button class="screen-back" id="gamesBackBtn">← Games</button>
    <h1 id="levelScreenTitle">Spell It! 🐣</h1>
    <div class="tagline" id="levelScreenTagline">Pick a level to start spelling</div>
    <div class="level-list" id="levelList"></div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:16px;">
    <div class="top-bar">
      <button class="back-btn" id="backBtn">← Levels</button>
    </div>
    <div class="progress" id="progress"></div>
    <div class="stage">
      <div class="picture-frame" id="pictureFrame">🐱</div>
      <button class="say-btn" id="sayBtn" aria-label="Hear the word">🔊 Hear it again</button>
      <div id="soundHint" class="hidden" style="font-size:12px; color:#6B7C8C; font-weight:600; text-align:center; margin-top:-8px;">No sound? Check your device's volume and text‑to‑speech settings.</div>

      <div id="spellArea">
        <div class="slots" id="slots"></div>
        <div class="tiles" id="tiles"></div>
      </div>

      <div id="pickArea" class="hidden">
        <div class="pick-options" id="pickOptions"></div>
      </div>

      <div id="addArea" class="hidden">
        <div class="sentence-card" id="sentenceCard"></div>
        <div class="pick-options" id="addOptions" style="margin-top:14px;"></div>
      </div>

      <div class="celebrate" id="celebrate"></div>
      <div style="display:flex; gap:10px;">
        <button class="next-btn" id="nextBtn">Next word →</button>
        <button class="redo-btn" id="redoBtn">🔁 Redo level</button>
        <button class="home-btn" id="homeBtn">🏠 Levels</button>
      </div>
    </div>
  </div>

</div>

  function startLevel(lv){
    currentLevel = lv;

  // queue=true appends after whatever is currently speaking instead of cutting it off.
  // Used when the word-complete message follows right after the last letter's (or
  // picked word's) own announcement, so it isn't interrupted mid-way.
  function speak(text, queue){
    if(!speechSupported) return;
    if(hasNativeTTS){
      try{ window.AndroidTTS.speak(text, !!queue); }catch(e){}
      return;
    }
    try{
      if(!queue){ window.speechSynthesis.cancel(); }
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85; u.pitch = 1.1; u.volume = 1;
      var voices = window.speechSynthesis.getVoices();
      if(voices && voices.length){
        var enVoice = voices.find(function(v){ return /en/i.test(v.lang); });
        if(enVoice) u.voice = enVoice;
      }
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

    answer = [];

    if(currentGame.id === 'add'){
      var item = sessionWords[idx];
      renderSentence(item);
      renderProgressDots();
      speak(item.text.replace('___', item.answer));
      return;
    }

    var w = sessionWords[idx];
    pictureFrame.textContent = w.emoji;
    pictureFrame.classList.remove('bump');
    void pictureFrame.offsetWidth;
    pictureFrame.classList.add('bump');

    if(currentGame.id === 'pick'){
      renderPickOptions(w);
    } else {
      renderSpellTiles(w);
    }

    renderProgressDots();
    speak(w.word);
  }

      btn.style.fontSize = sz.tileFont + 'px';
      btn.textContent = letter.toUpperCase();
      btn.addEventListener('click', function(){ handleTap(letter, btn); });
      tilesEl.appendChild(btn);
    });
  }

  function handleTap(letter, btn){
    speak(letter.toUpperCase());
    var w = sessionWords[idx];
    var expected = w.word[answer.length];
    if(letter === expected){
      answer.push(letter);
      btn.classList.add('used');
      var slot = slotsEl.children[answer.length - 1];
      slot.textContent = letter.toUpperCase();
      slot.classList.add('filled');
      if(answer.length === w.word.length) onWordComplete();
    } else {
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
    }
  }

  function buildOptionButtons(container, correctWord, onPick){
    var pool = currentLevel.words.filter(function(c){ return c.word !== correctWord; });
    var distractors = shuffle(pool).slice(0, PICK_OPTION_COUNT - 1).map(function(c){ return c.word; });
    var options = shuffle([correctWord].concat(distractors));

    container.innerHTML = '';
    options.forEach(function(word, i){
      var btn = document.createElement('button');
      btn.className = 'pick-option pc' + (i % 4);
      btn.textContent = word;
      btn.addEventListener('click', function(){ onPick(word, btn); });
      container.appendChild(btn);
    });
  }

  function renderPickOptions(w){
    buildOptionButtons(pickOptionsEl, w.word, handlePick);
  }

  function handlePick(word, btn){
    var w = sessionWords[idx];
    if(word === w.word){
      // onWordComplete() announces the word as part of its "word! Well done."
      // message, so it isn't spoken again here first.
      btn.classList.add('correct');
      Array.prototype.forEach.call(pickOptionsEl.children, function(optBtn){
        optBtn.classList.add('locked');
        if(optBtn !== btn) optBtn.classList.add('dim');
      });
      onWordComplete();
    } else {
      speak(word);
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
    }
  }

  function renderSentence(item){
    var parts = item.text.split('___');
    sentenceCardEl.innerHTML = '';
    sentenceCardEl.appendChild(document.createTextNode(parts[0]));
    var chip = document.createElement('span');
    chip.className = 'blank-chip';
    // A non-breaking space keeps the chip's height/min-width while empty; the
    // dashed border-bottom alone marks the blank, so there's only one line
    // under it (not one from underscore characters plus one from the border).
    chip.textContent = ' ';
    sentenceCardEl.appendChild(chip);
    blankChipEl = chip;
    sentenceCardEl.appendChild(document.createTextNode(parts[1]));
    buildOptionButtons(addOptionsEl, item.answer, handleAddPick);
  }

  function handleAddPick(word, btn){
    var item = sessionWords[idx];
    if(word === item.answer){
      // onWordComplete() announces the answer as part of its "word! Well done."
      // message, so it isn't spoken again here first.
      if(blankChipEl){
        blankChipEl.textContent = word;
        blankChipEl.classList.add('filled');
      }
      btn.classList.add('correct');
      Array.prototype.forEach.call(addOptionsEl.children, function(optBtn){
        optBtn.classList.add('locked');
        if(optBtn !== btn) optBtn.classList.add('dim');
      });
      onWordComplete();
    } else {
      speak(word);
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
    }
  }

  function onWordComplete(){
    var lv = currentLevel;
    var msgs = ['Great job! 🎉', 'You did it! ⭐', 'Super speller! 🌟', 'Awesome! 🎈'];
    celebrateEl.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    var completedWord = currentGame.id === 'add' ? sessionWords[idx].answer : sessionWords[idx].word;
    speak(completedWord + '! Well done.', true);
    launchConfetti();

    if(idx < sessionWords.length - 1){
      idx++;
      nextBtn.classList.add('show');
    } else {
      celebrateEl.textContent = 'You finished ' + lv.name + '! 🏆';
      idx = 0;
      redoBtn.classList.add('show');
      homeBtn.classList.add('show');
    }
    renderProgressDots();
  }

  function launchConfetti(){
    var layer = document.createElement('div');
    layer.className = 'confetti';
    var emojis = ['🎉','⭐','🎈','✨'];
    for(var i = 0; i < 16; i++){
      var s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = (Math.random()*100) + '%';
      s.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
      s.style.fontSize = (16 + Math.random()*14) + 'px';
      layer.appendChild(s);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 3000);
  }

  if(speechSupported){
    document.getElementById('soundHint').classList.remove('hidden');
  } else {
    sayBtn.textContent = '🔇 Sound unavailable';
    sayBtn.disabled = true;
  }

  sayBtn.addEventListener('click', function(){
    unlockAudioOnce();
    if(currentGame.id === 'add'){
      var item = sessionWords[idx];
      speak(item.text.replace('___', item.answer));
    } else {
      speak(sessionWords[idx].word);
    }
  });
  nextBtn.addEventListener('click', loadWord);
  redoBtn.addEventListener('click', function(){ startLevel(currentLevel); });
  homeBtn.addEventListener('click', goLevels);
  backBtn.addEventListener('click', goLevels);
  gamesBackBtn.addEventListener('click', goGames);

  renderGames();
})();
</script>
</body>
</html>
