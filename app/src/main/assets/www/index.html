<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spell It!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#54C6EB; --sky-deep:#2FB1D9; --sun:#FFD166; --coral:#FF6F5E;
    --leaf:#06D6A0; --ink:#20344A; --cloud:#FFFFFF; --violet:#8B7CF6;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* This is a single, deliberately bright, high-contrast palette for young kids —
     not a dual light/dark theme. Text colors are paired with fixed card/slot
     backgrounds throughout, so the palette intentionally does not follow the
     device's system dark-mode setting (which previously made filled letter
     slots render near-white text on a near-white background on some phones). */
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100%; font-family:'Nunito', sans-serif;
    background:linear-gradient(180deg,var(--sky) 0%, var(--sky-deep) 100%);
    color:var(--ink); display:flex; flex-direction:column; align-items:center; overflow-x:hidden;
  }
  /* Arabic (and any future RTL language) needs its own web font — Nunito/Baloo 2 have
     no Arabic glyphs, so the browser would otherwise silently fall back to whatever
     system Arabic font happens to be installed. Baloo Bhaijaan 2 is the official
     Arabic-script sibling of Baloo 2, so headings/buttons/etc keep the same rounded,
     playful feel across every language. This single high-specificity rule (one
     attribute selector + `*`) outranks every plain-class font-family rule below it
     without needing !important anywhere. */
  html[dir="rtl"] *{ font-family:'Baloo Bhaijaan 2', 'Baloo 2', 'Nunito', sans-serif; }
  /* Letter-spacing and forced capitalization are meaningless (and actively harmful —
     letter-spacing breaks Arabic's cursive letter-joining) for a script with no case. */
  html[dir="rtl"] .word-card{ letter-spacing:0; text-transform:none; }
  /* The dropdown's custom chevron and its padding are hardcoded to the right edge for
     LTR languages; mirror them for RTL so the chevron sits on the reading-start side. */
  html[dir="rtl"] .lang-select{ padding:9px 18px 9px 34px; background-position:left 10px center; }
  .wrap{ width:100%; max-width:480px; padding:16px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  h1{ font-family:'Baloo 2', sans-serif; color:#fff; font-size:28px; margin:2px 0 0; text-shadow:0 3px 0 rgba(0,0,0,0.12); }
  .tagline{ color:#fff; opacity:0.9; font-weight:600; margin-top:-10px; text-align:center; font-size:14px; }
  .hidden{ display:none !important; }

  /* Games screen */
  .game-list{ width:100%; display:flex; flex-direction:column; gap:16px; margin-top:6px; }
  .game-card{
    background:var(--cloud); border:none; border-radius:26px; padding:22px 20px;
    display:flex; align-items:center; gap:18px; cursor:pointer; text-align:start;
    box-shadow:0 8px 0 rgba(0,40,60,0.18); width:100%;
  }
  .game-card:active{ transform:translateY(4px); box-shadow:0 4px 0 rgba(0,40,60,0.18); }
  .game-emoji{ font-size:44px; width:60px; text-align:center; }
  .game-info{ flex:1; }
  .game-name{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:21px; color:var(--ink); }
  .game-tagline{ font-size:13px; color:#6B7C8C; font-weight:600; margin-top:3px; }

  /* Language switch (games screen only) */
  .lang-switch{ display:flex; justify-content:center; margin-top:2px; }
  .lang-select{
    border:none; border-radius:999px; padding:9px 34px 9px 18px; font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:14px; cursor:pointer; background-color:#fff; color:var(--ink);
    box-shadow:0 4px 0 rgba(0,40,60,0.18); -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2320344A'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; background-size:18px;
  }
  .lang-select:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,40,60,0.18); }

  /* Levels screen */
  .screen-back{
    align-self:flex-start; border:none; background:rgba(255,255,255,0.25); color:#fff; font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:14px; padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .level-list{ width:100%; display:flex; flex-direction:column; gap:14px; margin-top:2px; }
  .level-card{
    background:var(--cloud); border:none; border-radius:22px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer; text-align:start;
    box-shadow:0 8px 0 rgba(0,40,60,0.18); width:100%;
  }
  .level-card:active{ transform:translateY(4px); box-shadow:0 4px 0 rgba(0,40,60,0.18); }
  .level-emoji{ font-size:38px; width:56px; text-align:center; }
  .level-info{ flex:1; }
  .level-name{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:19px; color:var(--ink); }
  .level-sub{ font-size:13px; color:#6B7C8C; font-weight:600; margin-top:2px; }
  .level-easy .level-emoji{ color:var(--leaf); }

  /* Game screen */
  .top-bar{ width:100%; display:flex; align-items:center; }
  .back-btn{
    border:none; background:rgba(255,255,255,0.25); color:#fff; font-family:'Baloo 2', sans-serif;
    font-weight:700; font-size:14px; padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .stage{ width:100%; background:var(--cloud); border-radius:28px; padding:18px 18px 16px; box-shadow:0 14px 0 rgba(0,40,60,0.18); display:flex; flex-direction:column; align-items:center; gap:12px; }
  .picture-frame{ width:112px;height:112px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #FFF6DA, var(--sun)); display:flex;align-items:center;justify-content:center; font-size:56px; box-shadow:inset 0 -6px 0 rgba(0,0,0,0.08); user-select:none; }
  .picture-frame.bump{ animation:bump .5s ease; }
  @keyframes bump{ 0%{transform:scale(1)} 30%{transform:scale(1.12)} 100%{transform:scale(1)} }

  .say-btn{ border:none; background:var(--sky-deep); color:#fff; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px; padding:8px 16px; border-radius:999px; display:flex; align-items:center; gap:8px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.15); }
  .say-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }

  /* Spell It! mode */
  .slots{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; min-height:38px; }
  .slot{ width:32px;height:38px; border-radius:8px; border:3px solid #D9E4EC; display:flex;align-items:center;justify-content:center; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:18px; color:var(--ink); background:#F5F9FB; }
  .slot.filled{ border-color:var(--leaf); background:#E7FBF4; }

  .tiles{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-top:2px; }
  .tile{ width:40px;height:44px; border-radius:12px; border:none; background:var(--coral); color:#fff; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:19px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.18); }
  .tile:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.18); }
  .tile.used{ visibility:hidden; }
  .tile.shake{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* Pick It! mode (also used by Add It!'s answer choices) — a 2-column grid instead
     of one option per line, so 5 choices take up about half the vertical space. */
  .pick-options{ display:grid; grid-template-columns:repeat(2, 1fr); gap:9px 10px; width:100%; max-width:360px; }
  .pick-option{
    border:none; border-radius:14px; padding:11px 8px; width:100%;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:15px; line-height:1.15;
    cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.18); text-align:center;
    word-break:break-word; overflow-wrap:break-word;
  }
  /* With an odd number of choices (5), let the last one span both columns so it's
     centered on its own row instead of leaving an awkward empty cell. */
  .pick-options .pick-option:last-child:nth-child(odd){ grid-column:1 / -1; max-width:calc(50% - 5px); justify-self:center; }
  .pick-option:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.18); }
  .pick-option.shake{ animation:shake .4s ease; }
  .pick-option.pc0{ background:var(--coral); color:#fff; }
  .pick-option.pc1{ background:var(--sky-deep); color:#fff; }
  .pick-option.pc2{ background:var(--violet); color:#fff; }
  .pick-option.pc3{ background:var(--sun); color:var(--ink); }
  .pick-option.correct{ background:var(--leaf); color:#fff; }
  .pick-option.dim{ opacity:0.4; }
  .pick-option.locked{ pointer-events:none; }

  /* Add It! mode */
  .sentence-card{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:18px; color:var(--ink); text-align:center; line-height:1.45; padding:2px 4px; }
  .blank-chip{ display:inline-block; min-width:70px; padding:2px 12px; border-bottom:3px dashed var(--coral); font-weight:800; color:var(--coral); }
  .blank-chip.filled{ border-bottom-color:transparent; color:var(--leaf); }
  .sentence-word{ display:inline-block; border-radius:6px; padding:1px 4px; margin:0 -4px; transition:background-color .12s ease, color .12s ease; }
  .sentence-word.highlight, .blank-chip.highlight{ background:var(--sun); color:var(--ink); }

  /* Build It! mode */
  .build-slots{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-height:34px; }
  .build-slot{ min-width:30px; height:34px; padding:0 9px; border-radius:8px; border:3px solid #D9E4EC; display:flex;align-items:center;justify-content:center; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:14px; color:var(--ink); background:#F5F9FB; }
  .build-slot.filled{ border-color:var(--leaf); background:#E7FBF4; }

  .build-tiles{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:4px; }
  .build-tile{ border:none; border-radius:12px; padding:9px 14px; background:var(--coral); color:#fff; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:14px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.18); }
  .build-tile:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.18); }
  .build-tile.used{ visibility:hidden; }
  .build-tile.shake{ animation:shake .4s ease; }

  /* See It! mode */
  .word-card{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:32px; color:var(--ink); text-align:center; letter-spacing:0.5px; text-transform:capitalize; }
  .picture-options{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; width:100%; max-width:260px; }
  .picture-option{
    border:none; border-radius:20px; background:#F5F9FB; aspect-ratio:1 / 1;
    font-size:44px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.15);
  }
  .picture-option:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }
  .picture-option.shake{ animation:shake .4s ease; }
  .picture-option.correct{ background:var(--leaf); box-shadow:0 5px 0 rgba(0,0,0,0.15); }
  .picture-option.dim{ opacity:0.4; }
  .picture-option.locked{ pointer-events:none; }

  .celebrate{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:19px; color:var(--leaf); min-height:22px; text-align:center; }
  .next-btn{ border:none; color:#fff; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px; padding:10px 18px; border-radius:999px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.15); display:none; background:var(--leaf); }
  .next-btn.show{ display:inline-block; }
  .next-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }

  .confetti{ position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:5; }
  .confetti span{ position:absolute; top:-20px; font-size:20px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); opacity:0.9; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- GAMES SCREEN -->
  <div id="gamesScreen">
    <h1 id="gamesTitle">Let's Play! 🎈</h1>
    <div class="tagline" id="gamesTagline">Choose a game to start</div>
    <div class="lang-switch" id="langSwitch">
      <select class="lang-select" id="langSelect">
        <option value="en">🇬🇧 English</option>
        <option value="da">🇩🇰 Dansk</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="es">🇪🇸 Español</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="pl">🇵🇱 Polski</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
    <div class="game-list" id="gameList"></div>
  </div>

  <!-- LEVELS SCREEN -->
  <div id="levelScreen" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:16px;">
    <button class="screen-back" id="gamesBackBtn">← Games</button>
    <h1 id="levelScreenTitle">Spell It! 🐣</h1>
    <div class="tagline" id="levelScreenTagline">Pick a level to start spelling</div>
    <div class="level-list" id="levelList"></div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:16px;">
    <div class="top-bar">
      <button class="back-btn" id="backBtn">← Levels</button>
    </div>
    <div class="stage">
      <div class="picture-frame" id="pictureFrame">🐱</div>
      <button class="say-btn" id="sayBtn" aria-label="Hear the word">🔊 Hear it again</button>
      <div id="soundHint" class="hidden" style="font-size:12px; color:#6B7C8C; font-weight:600; text-align:center; margin-top:-8px;">No sound? Check your device's volume and text‑to‑speech settings.</div>

      <div id="spellArea">
        <div class="slots" id="slots"></div>
        <div class="tiles" id="tiles"></div>
      </div>

      <div id="pickArea" class="hidden">
        <div class="pick-options" id="pickOptions"></div>
      </div>

      <div id="addArea" class="hidden">
        <div class="sentence-card" id="sentenceCard"></div>
        <div class="pick-options" id="addOptions" style="margin-top:14px;"></div>
      </div>

      <div id="seeArea" class="hidden">
        <div class="word-card" id="wordCard"></div>
        <div class="picture-options" id="pictureOptions" style="margin-top:14px;"></div>
      </div>

      <div id="buildArea" class="hidden">
        <div class="build-slots" id="buildSlots"></div>
        <div class="build-tiles" id="buildTiles"></div>
      </div>

      <div class="celebrate" id="celebrate"></div>
      <div style="display:flex; gap:10px;">
        <button class="next-btn" id="nextBtn">Next word →</button>
      </div>
    </div>
  </div>

</div>

  // When running inside the Android app shell, window.AndroidTTS is injected by

  // Add It!'s word-by-word sentence highlighting. sentenceTokens/sentenceWordEls are
  // parallel arrays (built by renderSentence) mapping each word's character range in
  // the spoken sentence to the DOM element that should light up while it's being said.
  // activeWordBoundaryHandler is only set while a highlightable sentence is speaking;
  // every other speak() call (single words, letters, the well-done message) clears it.
  var sentenceTokens = null, sentenceWordEls = null, lastHighlightEl = null;
  var activeWordBoundaryHandler = null;

  function clearSentenceHighlight(){
    if(lastHighlightEl){ lastHighlightEl.classList.remove('highlight'); lastHighlightEl = null; }
  }

  function highlightWordAtCharIndex(charIndex){
    if(!sentenceTokens || !sentenceWordEls) return;
    for(var i = 0; i < sentenceTokens.length; i++){
      var t = sentenceTokens[i];
      if(charIndex >= t.start && charIndex < t.end){
        clearSentenceHighlight();
        var el = sentenceWordEls[i];
        el.classList.add('highlight');
        lastHighlightEl = el;
        return;
      }
    }
  }

  var nextBtn = document.getElementById('nextBtn');
  var backBtn = document.getElementById('backBtn');
  var gamesBackBtn = document.getElementById('gamesBackBtn');
  var sayBtn = document.getElementById('sayBtn');
  var soundHintEl = document.getElementById('soundHint');

  // Applies every piece of STRINGS-driven UI copy for the current language, plus
  // the games list (which carries its own per-language names/taglines). Called on
  // load and whenever the language switch is tapped; the level/game screens pick
  // up the new language the next time they're opened, since the language switch
  // only lives on the games screen (no need to re-render mid-round).
  function applyLangStrings(){
    var strs = STRINGS[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    gamesTitleEl.textContent = strs.gamesTitle;
    gamesTaglineEl.textContent = strs.gamesTagline;
    gamesBackBtn.textContent = strs.backToGames;
    backBtn.textContent = strs.backToLevels;
    soundHintEl.textContent = strs.soundHint;
    nextBtn.textContent = strs.nextWord;
    if(speechSupported){
      sayBtn.textContent = strs.hearItAgain;
      sayBtn.setAttribute('aria-label', strs.hearWordAria);
    } else {
      sayBtn.textContent = strs.soundUnavailable;
    }
    langSelectEl.value = lang;
    renderGames();
  }

  function setLang(newLang){
    if(SUPPORTED_LANGS.indexOf(newLang) === -1) return;
    if(newLang === lang) return;
    lang = newLang;
    try{ localStorage.setItem(LANG_STORAGE_KEY, lang); }catch(e){}
    applyLangStrings();
  }

  function renderGames(){
    gameListEl.innerHTML = '';
    GAMES_BY_LANG[lang].forEach(function(g){
      var btn = document.createElement('button');
      btn.className = 'game-card';
      btn.innerHTML =
        '<div class="game-emoji">' + g.emoji + '</div>' +
        '<div class="game-info">' +
          '<div class="game-name">' + g.name + '</div>' +
          '<div class="game-tagline">' + g.tagline + '</div>' +
        '</div>';
      btn.addEventListener('click', function(){ openGame(g); });
      gameListEl.appendChild(btn);
    });
  }

  function openGame(g){
    currentGame = g;
    levelScreenTitle.textContent = g.name + ' ' + g.emoji;
    levelScreenTagline.textContent = STRINGS[lang].pickLevelPrefix + (LEVEL_TAGLINE_VERB_BY_LANG[lang][g.id] || '');
    gamesScreen.classList.add('hidden');
    levelScreen.classList.remove('hidden');
    renderLevels();
  }

  function renderLevels(){
    levelListEl.innerHTML = '';
    LEVELS_BY_LANG[lang].forEach(function(lv){
      var btn = document.createElement('button');
      btn.className = 'level-card level-' + lv.id;
      btn.innerHTML =
        '<div class="level-emoji">' + lv.emoji + '</div>' +
        '<div class="level-info">' +
          '<div class="level-name">' + lv.name + '</div>' +
          '<div class="level-sub">' + lv.sub + '</div>' +
        '</div>';
      btn.addEventListener('click', function(){ startLevel(lv); });
      levelListEl.appendChild(btn);
    });
  }

  function startLevel(lv){
    currentLevel = lv;
    // The whole level's pool is shuffled into a deck and drawn from one at a time;
    // loadWord() reshuffles and starts a fresh lap whenever the deck runs out, so a
    // level never "finishes" — it just keeps going until the player backs out.
    sessionWords = shuffle(poolForGame(currentGame.id, lv));
    idx = 0;
    levelScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    loadWord();
  }

  function goLevels(){
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    gameScreen.classList.add('hidden');
    levelScreen.classList.remove('hidden');
    renderLevels();
  }

  function goGames(){
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    levelScreen.classList.add('hidden');
    gamesScreen.classList.remove('hidden');
    renderGames();
  }

  // queue=true appends after whatever is currently speaking instead of cutting it off.
  // Used when the word-complete message follows right after the last letter's (or
  // picked word's) own announcement, so it isn't interrupted mid-way.
  // Speech always uses the currently active language (lang), so words, letters and
  // celebration messages are spoken in the right voice without any extra plumbing
  // at each call site.
  // opts.slow reads the text at SENTENCE_SLOW_RATE instead of the normal word/letter
  // rate (used for Add It!/Build It!'s full sentences). opts.onWord, when given, is
  // called with the character offset of each word as it starts being spoken, driving
  // Add It!'s word-by-word highlight; every call resets the active handler, so it
  // never lingers into an unrelated later speak() call.
  function speak(text, queue, opts){
    opts = opts || {};
    activeWordBoundaryHandler = opts.onWord || null;
    if(!speechSupported) return;
    var ttsLang = LANG_TTS_CODE[lang] || 'en-US';
    if(hasNativeTTS){
      try{ window.AndroidTTS.speak(text, !!queue, ttsLang, !!opts.slow, !!opts.onWord); }catch(e){}
      return;
    }
    try{
      if(!queue){ window.speechSynthesis.cancel(); }
      var u = new SpeechSynthesisUtterance(text);
      u.rate = opts.slow ? SENTENCE_SLOW_RATE : NORMAL_RATE; u.pitch = 1.1; u.volume = 1;
      u.lang = ttsLang;
      if(opts.onWord){
        u.onboundary = function(event){
          if(event && event.name === 'word') opts.onWord(event.charIndex || 0);
        };
      }
      var voices = window.speechSynthesis.getVoices();
      if(voices && voices.length){
        var langPrefix = ttsLang.split('-')[0].toLowerCase();
        var matchVoice = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(langPrefix) === 0; });
        if(matchVoice) u.voice = matchVoice;
      }
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sentenceWordCount(item){
    return item.text.replace('___', item.answer).trim().split(/\s+/).length;
  }

  // Add It! always draws from a level's full sentence pool. Build It! does too,
  // except on Easy, where it's narrowed to that level's own shorter sentences so
  // Easy puzzles are noticeably shorter than Medium/Hard — falling back to the
  // full pool if too few sentences are short enough to keep enough variety.
  function buildPoolFor(level){
    if(level.id !== 'easy') return level.sentences;
    var shorter = level.sentences.filter(function(s){ return sentenceWordCount(s) <= BUILD_EASY_MAX_WORDS; });
    return shorter.length >= BUILD_EASY_MIN_POOL ? shorter : level.sentences;
  }

  // Randomise It! draws from a single combined deck built out of every other
  // game's own content for this level: each word gets a Spell/Pick/See-shaped
  // entry, and each sentence (from the same pool Add It!/Build It! already use)
  // gets an Add- and a Build-shaped entry. Every entry carries the gameId it
  // came from, so shuffling this one deck together is what makes the mix of
  // games random from round to round — loadWord() just reads that gameId back
  // off the current entry instead of always using currentGame.id.
  function buildRandomPool(level){
    var pool = [];
    level.words.forEach(function(w){
      pool.push({ gameId:'spell', word:w.word, emoji:w.emoji });
      pool.push({ gameId:'pick', word:w.word, emoji:w.emoji });
      pool.push({ gameId:'see', word:w.word, emoji:w.emoji });
    });
    level.sentences.forEach(function(s){
      pool.push({ gameId:'add', text:s.text, answer:s.answer });
    });
    buildPoolFor(level).forEach(function(s){
      pool.push({ gameId:'build', text:s.text, answer:s.answer });
    });
    return pool;
  }

  // The deck a level shuffles together for a given game: Randomise It! gets the
  // combined multi-game deck above, Build It! gets its (possibly Easy-shortened)
  // sentence pool, Add It! the level's full sentences, and every other game the
  // level's words.
  function poolForGame(gameId, level){
    if(gameId === 'random') return buildRandomPool(level);
    if(gameId === 'build') return buildPoolFor(level);
    if(gameId === 'add') return level.sentences;
    return level.words;
  }

  // Shows only the game area that matches gid, hiding the rest. Called every
  // round (not just once per level) so Randomise It! can switch which area is
  // visible as its underlying game changes from one round to the next.
  function applyAreaVisibility(gid){
    var usesSentences = gid === 'add' || gid === 'build';
    // See It! shows the word, not the picture — the picture is the answer. Build
    // It! has no single picture either — the whole sentence is the puzzle.
    pictureFrame.classList.toggle('hidden', usesSentences || gid === 'see');
    spellArea.classList.toggle('hidden', gid !== 'spell');
    pickArea.classList.toggle('hidden', gid !== 'pick');
    addArea.classList.toggle('hidden', gid !== 'add');
    seeArea.classList.toggle('hidden', gid !== 'see');
    buildArea.classList.toggle('hidden', gid !== 'build');
  }

  function loadWord(){
    // Reshuffle and start a new lap once the deck is exhausted, instead of ending
    // the level — Easy/Medium/Hard just keep going until the player backs out.
    if(idx >= sessionWords.length){
      sessionWords = shuffle(poolForGame(currentGame.id, currentLevel));
      idx = 0;
    }

    answer = [];
    celebrateEl.textContent = '';
    nextBtn.classList.remove('show');

    var current = sessionWords[idx];
    // Randomise It! reads which game this round is from the entry itself (set
    // when the combined deck was built); every other game just uses its own id.
    var gid = currentGame.id === 'random' ? current.gameId : currentGame.id;
    applyAreaVisibility(gid);

    if(gid === 'add'){
      renderSentence(current);
      speak(current.text.replace('___', current.answer), false, { slow: true, onWord: highlightWordAtCharIndex });
      return;
    }

    if(gid === 'build'){
      renderBuildTiles(current);
      speak(current.text.replace('___', current.answer), false, { slow: true });
      return;
    }

    if(gid === 'see'){
      wordCardEl.textContent = current.word;
      renderPictureOptions(current);
      speak(current.word);
      return;
    }

    pictureFrame.textContent = current.emoji;
    pictureFrame.classList.remove('bump');
    void pictureFrame.offsetWidth;
    pictureFrame.classList.add('bump');

    if(gid === 'pick'){
      renderPickOptions(current);
    } else {
      renderSpellTiles(current);
    }

    speak(current.word);
  }

  // Longer words (up to 12 letters) get smaller slots/tiles so they still fit on
  // one screen without scrolling, even on small phones.
  function tileSizeFor(len){
    if(len <= 6) return { tile:40, tileH:44, tileFont:19, slot:32, slotH:38, slotFont:18, gap:7 };
    if(len <= 9) return { tile:34, tileH:38, tileFont:16, slot:27, slotH:32, slotFont:15, gap:6 };
    return { tile:28, tileH:32, tileFont:14, slot:22, slotH:27, slotFont:13, gap:5 };
  }

  function renderSpellTiles(w){
    var sz = tileSizeFor(w.word.length);

    slotsEl.innerHTML = '';
    slotsEl.style.gap = sz.gap + 'px';
    for(var i = 0; i < w.word.length; i++){
      var s = document.createElement('div');
      s.className = 'slot';
      s.style.width = sz.slot + 'px';
      s.style.height = sz.slotH + 'px';
      s.style.fontSize = sz.slotFont + 'px';
      slotsEl.appendChild(s);
    }

    var letters = shuffle(w.word.split(''));
    tilesEl.innerHTML = '';
    tilesEl.style.gap = sz.gap + 'px';
    letters.forEach(function(letter){
      var btn = document.createElement('button');
      btn.className = 'tile';
      btn.style.width = sz.tile + 'px';
      btn.style.height = sz.tileH + 'px';
      btn.style.fontSize = sz.tileFont + 'px';
      btn.textContent = letter.toUpperCase();
      btn.addEventListener('click', function(){ handleTap(letter, btn); });
      tilesEl.appendChild(btn);
    });
  }

  function handleTap(letter, btn){
    speak(letter.toUpperCase());
    var w = sessionWords[idx];
    var expected = w.word[answer.length];
    if(letter === expected){
      answer.push(letter);
      btn.classList.add('used');
      var slot = slotsEl.children[answer.length - 1];
      slot.textContent = letter.toUpperCase();
      slot.classList.add('filled');
      if(answer.length === w.word.length) onWordComplete();
    } else {
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
    }
  }

  // Tiles/slots show every word in capitals (matching Spell It!'s uppercase letter
  // tiles) and drop the sentence-ending period from the last word only — internal
  // punctuation (commas, an apostrophe, etc.) on other words is left alone. This is
  // purely a display transform: matching/order-checking still uses the original
  // (lowercase, period-intact) token text via buildTokens, so it's unaffected.
  function buildDisplayToken(tok, isLast){
    var t = isLast ? tok.replace(/\.+$/, '') : tok;
    return t.toUpperCase();
  }

  // Build It! reuses the same {text, answer} sentence bank as Add It! — the full
  // sentence (blank filled in with its answer) is split on whitespace into the
  // words the player has to tap back into order, so no separate content bank is
  // needed and the puzzle's difficulty naturally follows the level's sentences
  // (which already run longer, on average, from easy to medium to hard).
  function renderBuildTiles(item){
    var full = item.text.replace('___', item.answer);
    buildTokens = full.trim().split(/\s+/);
    var lastIdx = buildTokens.length - 1;

    buildSlotsEl.innerHTML = '';
    buildTokens.forEach(function(){
      var s = document.createElement('div');
      s.className = 'build-slot';
      buildSlotsEl.appendChild(s);
    });

    var order = shuffle(buildTokens.map(function(_, i){ return i; }));
    buildTilesEl.innerHTML = '';
    order.forEach(function(i){
      var tok = buildTokens[i];
      var btn = document.createElement('button');
      btn.className = 'build-tile';
      btn.textContent = buildDisplayToken(tok, i === lastIdx);
      btn.addEventListener('click', function(){ handleBuildTap(tok, btn); });
      buildTilesEl.appendChild(btn);
    });
  }

  function handleBuildTap(token, btn){
    var expected = buildTokens[answer.length];
    if(token === expected){
      speak(token);
      answer.push(token);
      btn.classList.add('used');
      var slot = buildSlotsEl.children[answer.length - 1];
      slot.textContent = buildDisplayToken(token, answer.length === buildTokens.length);
      slot.classList.add('filled');
      if(answer.length === buildTokens.length) onWordComplete();
    } else {
      // Announce the wrongly-tapped word itself, same as a wrong Pick It!/Add
      // It!/See It! tap, so the child hears what they just tapped.
      speak(token);
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
    }
  }

  function buildOptionButtons(container, correctWord, onPick){
    var pool = currentLevel.words.filter(function(c){ return c.word !== correctWord; });
    var distractors = shuffle(pool).slice(0, PICK_OPTION_COUNT - 1).map(function(c){ return c.word; });
    var options = shuffle([correctWord].concat(distractors));

    container.innerHTML = '';
    options.forEach(function(word, i){
      var btn = document.createElement('button');
      btn.className = 'pick-option pc' + (i % 4);
      btn.textContent = word;
      btn.addEventListener('click', function(){ onPick(word, btn); });
      container.appendChild(btn);
    });
  }

  function renderPickOptions(w){
    buildOptionButtons(pickOptionsEl, w.word, handlePick);
  }

  function handlePick(word, btn){
    var w = sessionWords[idx];
    if(word === w.word){
      // onWordComplete() announces the word as part of its "word! Well done."
      // message, so it isn't spoken again here first.
      btn.classList.add('correct');
      Array.prototype.forEach.call(pickOptionsEl.children, function(optBtn){
        optBtn.classList.add('locked');
        if(optBtn !== btn) optBtn.classList.add('dim');
      });
      onWordComplete();
    } else {
      speak(word);
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
    }
  }

  // Renders the sentence as one span per word (plus the blank chip in the answer's
  // place) instead of two plain text nodes, so each word can be highlighted
  // individually as it's spoken. sentenceTokens records each word's character
  // range within the FILLED sentence (the same text speak() is given), which is
  // what highlightWordAtCharIndex matches TTS word-boundary events against.
  function renderSentence(item){
    clearSentenceHighlight();
    var blankStart = item.text.indexOf('___');
    var filled = item.text.replace('___', item.answer);

    var tokens = [];
    var re = /\S+/g, m;
    while((m = re.exec(filled))){
      tokens.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
    }
    var blankTokenIndex = tokens.findIndex(function(t){ return blankStart >= t.start && blankStart < t.end; });

    sentenceCardEl.innerHTML = '';
    sentenceWordEls = [];
    blankChipEl = null;
    tokens.forEach(function(tok, i){
      if(i > 0) sentenceCardEl.appendChild(document.createTextNode(' '));
      if(i === blankTokenIndex){
        var chip = document.createElement('span');
        chip.className = 'blank-chip';
        // A non-breaking space keeps the chip's height/min-width while empty; the
        // dashed border-bottom alone marks the blank, so there's only one line
        // under it (not one from underscore characters plus one from the border).
        chip.textContent = ' ';
        sentenceCardEl.appendChild(chip);
        blankChipEl = chip;
        sentenceWordEls.push(chip);
      } else {
        var span = document.createElement('span');
        span.className = 'sentence-word';
        span.textContent = tok.text;
        sentenceCardEl.appendChild(span);
        sentenceWordEls.push(span);
      }
    });
    sentenceTokens = tokens;
    buildOptionButtons(addOptionsEl, item.answer, handleAddPick);
  }

  function handleAddPick(word, btn){
    var item = sessionWords[idx];
    if(word === item.answer){
      // onWordComplete() announces the answer as part of its "word! Well done."
      // message, so it isn't spoken again here first.
      if(blankChipEl){
        blankChipEl.textContent = word;
        blankChipEl.classList.add('filled');
      }
      btn.classList.add('correct');
      Array.prototype.forEach.call(addOptionsEl.children, function(optBtn){
        optBtn.classList.add('locked');
        if(optBtn !== btn) optBtn.classList.add('dim');
      });
      onWordComplete();
    } else {
      speak(word);
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
    }
  }

  function renderPictureOptions(w){
    var pool = currentLevel.words.filter(function(c){ return c.word !== w.word; });
    var distractors = shuffle(pool).slice(0, SEE_OPTION_COUNT - 1);
    var options = shuffle([w].concat(distractors));

    pictureOptionsEl.innerHTML = '';
    options.forEach(function(candidate){
      var btn = document.createElement('button');
      btn.className = 'picture-option';
      btn.textContent = candidate.emoji;
      btn.setAttribute('aria-label', candidate.word);
      btn.addEventListener('click', function(){ handleSeePick(candidate.word, btn); });
      pictureOptionsEl.appendChild(btn);
    });
  }

  function handleSeePick(word, btn){
    var w = sessionWords[idx];
    if(word === w.word){
      // onWordComplete() announces the word as part of its "word! Well done."
      // message, so it isn't spoken again here first.
      btn.classList.add('correct');
      Array.prototype.forEach.call(pictureOptionsEl.children, function(optBtn){
        optBtn.classList.add('locked');
        if(optBtn !== btn) optBtn.classList.add('dim');
      });
      onWordComplete();
    } else {
      // Announce the wrong picture's own word, same as a wrong Pick It!/Add It! tap.
      speak(word);
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
    }
  }

  function onWordComplete(){
    var strs = STRINGS[lang];
    var msgs = strs.celebrate;
    celebrateEl.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    var current = sessionWords[idx];
    var gid = currentGame.id === 'random' ? current.gameId : currentGame.id;
    // Build It!'s completed unit is a whole sentence, not a single word, so the
    // wellDone string (written to tack onto a short word, e.g. "cat! Well done.")
    // is spoken on its own instead of appended to the sentence.
    var completedWord;
    if(gid === 'build'){
      completedWord = '';
    } else if(gid === 'add'){
      completedWord = current.answer;
    } else {
      completedWord = current.word;
    }
    // wellDone begins with a punctuation mark meant to follow a spoken word
    // (e.g. "! Well done."). With no word in front of it (Build It!), that
    // leading mark has nothing to attach to, and some TTS voices read it as
    // its own name (e.g. Danish saying "udråbstegn") instead of treating
    // it as punctuation. Strip it so Build It! speaks a clean standalone phrase.
    var wellDoneText = strs.wellDone;
    if(completedWord === ''){
      wellDoneText = wellDoneText.replace(/^[\s ]*[!?.,][\s ]*/, '');
    }
    speak(completedWord + wellDoneText, true);
    launchConfetti();

    // A level never ends here — idx just keeps advancing, and loadWord() reshuffles
    // a fresh lap through the deck once it runs out. The player leaves whenever they
    // want via the "← Levels"/"← Games" back buttons, not by "finishing".
    idx++;
    nextBtn.classList.add('show');
  }

  function launchConfetti(){
    var layer = document.createElement('div');
    layer.className = 'confetti';
    var emojis = ['🎉','⭐','🎈','✨'];
    for(var i = 0; i < 16; i++){
      var s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = (Math.random()*100) + '%';
      s.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
      s.style.fontSize = (16 + Math.random()*14) + 'px';
      layer.appendChild(s);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 3000);
  }

  if(speechSupported){
    soundHintEl.classList.remove('hidden');
  } else {
    sayBtn.disabled = true;
  }

  sayBtn.addEventListener('click', function(){
    unlockAudioOnce();
    var current = sessionWords[idx];
    var gid = currentGame.id === 'random' ? current.gameId : currentGame.id;
    if(gid === 'add'){
      speak(current.text.replace('___', current.answer), false, { slow: true, onWord: highlightWordAtCharIndex });
    } else if(gid === 'build'){
      speak(current.text.replace('___', current.answer), false, { slow: true });
    } else {
      speak(current.word);
    }
  });
  nextBtn.addEventListener('click', loadWord);
  backBtn.addEventListener('click', goLevels);
  gamesBackBtn.addEventListener('click', goGames);
  langSelectEl.addEventListener('change', function(){ setLang(this.value); });

  // Sets all STRINGS-driven text (including the games list) for the language
  // restored from localStorage (or the 'en' default), and renders the games list.
  applyLangStrings();
})();
</script>
</body>
</html>
