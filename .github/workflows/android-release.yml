name: Build Signed Release AAB

# Builds the signed Android App Bundle (.aab) that Google Play requires for
# submission. Unlike android-build.yml's debug APK, this never runs
# automatically on push — it's manually triggered, since a signed release
# build is a deliberate "prepare this for a Play Store upload" action, not
# something to produce on every commit.
#
# Requires four repo secrets (Settings -> Secrets and variables -> Actions):
#   SPELLIT_RELEASE_KEYSTORE_BASE64  - the release keystore file, base64-encoded
#   SPELLIT_RELEASE_KEYSTORE_PASSWORD
#   SPELLIT_RELEASE_KEY_ALIAS
#   SPELLIT_RELEASE_KEY_PASSWORD
# Without them, this workflow fails fast with a clear error rather than
# silently producing an unsigned bundle.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        run: |
          missing=""
          [ -z "${{ secrets.SPELLIT_RELEASE_KEYSTORE_BASE64 }}" ] && missing="$missing SPELLIT_RELEASE_KEYSTORE_BASE64"
          [ -z "${{ secrets.SPELLIT_RELEASE_KEYSTORE_PASSWORD }}" ] && missing="$missing SPELLIT_RELEASE_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.SPELLIT_RELEASE_KEY_ALIAS }}" ] && missing="$missing SPELLIT_RELEASE_KEY_ALIAS"
          [ -z "${{ secrets.SPELLIT_RELEASE_KEY_PASSWORD }}" ] && missing="$missing SPELLIT_RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing required repo secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions before running this workflow."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        id: decode_keystore
        continue-on-error: true
        run: echo "${{ secrets.SPELLIT_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/spellit-release.keystore"

      # Diagnostic-only step. Actions job logs on this runner get uploaded to an
      # off-domain blob-storage URL that isn't reachable for reading back, so if the
      # decode step above fails, this records SAFE, non-secret metadata (lengths,
      # charset check, byte count, magic-byte prefix) to a file and pushes it to a
      # throwaway branch instead, purely so the failure can be diagnosed. It never
      # prints or stores any of the actual secret values.
      - name: Record safe keystore diagnostics
        if: always()
        env:
          B64: ${{ secrets.SPELLIT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p debug
          {
            echo "decode_step_outcome=${{ steps.decode_keystore.outcome }}"
            echo "secret_length=${#B64}"
            bad_chars=$(printf '%s' "$B64" | tr -d 'A-Za-z0-9+/=\n\r \t' | wc -c | tr -d ' ')
            echo "non_base64_char_count=$bad_chars"
            if [ -f "$RUNNER_TEMP/spellit-release.keystore" ]; then
              echo "decoded_file_exists=true"
              echo "decoded_file_bytes=$(wc -c < "$RUNNER_TEMP/spellit-release.keystore" | tr -d ' ')"
              echo "decoded_file_first_bytes_hex=$(head -c 16 "$RUNNER_TEMP/spellit-release.keystore" | xxd -p | tr -d '\n')"
            else
              echo "decoded_file_exists=false"
            fi
          } > debug/keystore-diagnostic.txt
          cat debug/keystore-diagnostic.txt

      - name: Push diagnostics to a debug branch
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -B debug/keystore-diagnostic
          git add debug/keystore-diagnostic.txt
          git commit -m "Record keystore secret diagnostic (safe metadata only)" || echo "nothing to commit"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:debug/keystore-diagnostic

      - name: Fail job if keystore decode failed
        if: steps.decode_keystore.outcome == 'failure'
        run: |
          echo "Decoding SPELLIT_RELEASE_KEYSTORE_BASE64 failed - see debug/keystore-diagnostic.txt on the debug/keystore-diagnostic branch."
          exit 1

      - name: Build signed release AAB
        if: steps.decode_keystore.outcome == 'success'
        env:
          SPELLIT_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/spellit-release.keystore
          SPELLIT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SPELLIT_RELEASE_KEYSTORE_PASSWORD }}
          SPELLIT_RELEASE_KEY_ALIAS: ${{ secrets.SPELLIT_RELEASE_KEY_ALIAS }}
          SPELLIT_RELEASE_KEY_PASSWORD: ${{ secrets.SPELLIT_RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # If the Gradle build fails, push the last lines of its output (no secrets are printed
      # by Gradle) to a throwaway branch so the failure can be diagnosed without raw-log access.
      - name: Push build log tail to a debug branch on failure
        if: failure() && steps.decode_keystore.outcome == 'success'
        run: |
          mkdir -p debug
          tail -n 150 "$RUNNER_TEMP/gradle.log" > debug/gradle-failure.txt || echo "no log" > debug/gradle-failure.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -B debug/build-log
          git add debug/gradle-failure.txt
          git commit -m "Record Gradle failure tail" || true
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:debug/build-log

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/spellit-release.keystore"

      - name: Upload signed AAB as a workflow artifact
        if: steps.decode_keystore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: spell-it-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
